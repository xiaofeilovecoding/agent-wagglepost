[package]
name = "wagglepost"
version = "0.1.0"
edition = "2021"
description = "WagglePost: a local multi-agent router — dispatch tasks to native coding agents, review the same candidate with a second agent, and accept by version."
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "original-uri"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "process", "io-util"] }
include_dir = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }

[build-dependencies]
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
strip = true

[profile.dev]
opt-level = 0
debug = 1
