name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no repository, release or secret write from CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-test-ui:
    name: windows-build-test-ui
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web assets (locked)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch locked crates for offline test/build
        run: cargo fetch --locked

      - name: Offline unit and integration tests (locked)
        env:
          WAGGLEPOST_TEST_HTTP_DIAG: "1"
        run: cargo test --offline --locked --release -- --test-threads=2

      - name: Offline production build (locked)
        run: cargo build --offline --locked --release

      - name: Set up Python for Playwright
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install chromium

      - name: Production browser and served-asset gate
        run: python scripts/run_ui_gates.py --exe target/release/wagglepost.exe --out ci-artifacts

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wagglepost-windows-ui
          path: ci-artifacts/
          if-no-files-found: warn
